name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # One gate for the whole commons — the same `make check` a developer runs locally.
      - run: make check
