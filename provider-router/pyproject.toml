[project]
name = "agora-provider-router"
version = "0.1.0"
description = "The provider-router — an OpenAI-compatible gateway to model backends, implementing the sacred tier ladder."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "openai",
    "gateway",
    "llm",
    "router",
    "fastapi",
    "budget",
    "kcb",
    "agora",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Outbound calls to the paid / mlx-serve / Ollama tiers (US-AG2).
    "httpx>=0.27",
    # The Python half of the dual interchange validator (legacy-absorbed, ADR-0003):
    # draft-2020-12 validation of the ported koine schemas, the twin of @agora/schemas's ajv.
    "jsonschema>=4.21",
    "referencing>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Types for the interchange validator's jsonschema dependency (referencing ships its own).
    "types-jsonschema>=4.21",
]

[project.urls]
Homepage = "https://github.com/agora-commons/agora"
Repository = "https://github.com/agora-commons/agora"
Issues = "https://github.com/agora-commons/agora/issues"

[project.scripts]
agora-provider-router = "agora_provider_router.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agora_provider_router"]
# The shipped price sheet (US-1) is package data, not code — declare it explicitly so
# `uv build` includes it in the wheel and a clean-venv install can price the ladder.
artifacts = ["src/agora_provider_router/prices.toml"]

[tool.hatch.build.targets.wheel.force-include]
"src/agora_provider_router/prices.toml" = "agora_provider_router/prices.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
