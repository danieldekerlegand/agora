[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm"]

# agora's data-translation engine — a native Rust core (embeddable-first) that ports
# pinakes's culture-scrape exporters over the koine canonical node/edge graph. WASM
# (US-4), PyO3 (US-5), and a thin HTTP service (US-6) join as workspace members later.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
